# 应用服务 WEB 访问端口
server.port=8080
# 热更新
spring.devtools.restart.enabled=true
# 数据库地址：
spring.datasource.url=jdbc:mysql://localhost:3306/blog?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=lu123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 自动建表/更新表结构
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT（签发 + 全局校验，详见 doc/JWT认证实现说明.md）
# HS256 要求密钥长度至少 256 bit（32 字节），生产环境请改用环境变量或随机长密钥
jwt.secret=change-me-please-use-at-least-32-chars-long-secret-key!!
jwt.expiration-ms=86400000

# 不生成 spring-security 默认随机密码用户（本应用使用 JWT，无表单登录）
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration